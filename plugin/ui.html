<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        font: 12px/1.4 Inter, system-ui, sans-serif;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding: 14px;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        background: var(--figma-color-bg-secondary);
      }

      .status-copy {
        display: grid;
        gap: 2px;
      }

      .status-copy strong {
        font-size: 13px;
      }

      .status-detail {
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--figma-color-icon-tertiary);
      }

      .dot.connected {
        background: #22a06b;
      }

      .dot.error {
        background: #e5484d;
      }

      label {
        display: block;
        margin: 10px 0 4px;
        color: var(--figma-color-text-secondary);
      }

      input {
        width: 100%;
        height: 32px;
        padding: 0 9px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        outline: none;
      }

      input:focus {
        border-color: var(--figma-color-border-brand);
      }

      details {
        margin-top: 12px;
        padding: 0 10px 10px;
        border: 1px solid var(--figma-color-border);
        border-radius: 7px;
        background: var(--figma-color-bg-secondary);
      }

      details summary {
        padding: 9px 0;
        color: var(--figma-color-text-secondary);
        cursor: pointer;
        user-select: none;
      }

      .buttons {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 8px;
        margin-top: 0;
      }

      #seed-page {
        grid-column: 1 / -1;
      }

      #capture.alternative {
        color: var(--figma-color-text-brand);
        background: var(--figma-color-bg-secondary);
        border: 1px solid var(--figma-color-border-brand);
      }

      .pages {
        margin: 0 0 16px;
        border: 1px solid var(--figma-color-border);
        border-radius: 10px;
        overflow: hidden;
      }

      .pages-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: var(--figma-color-bg-secondary);
      }

      .pages-header strong { font-size: 12px; }
      .pages-header span {
        max-width: 70%;
        overflow: hidden;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .page-list {
        max-height: 210px;
        overflow: auto;
      }

      .page-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        padding: 9px 10px;
        border-top: 1px solid var(--figma-color-border);
        cursor: pointer;
      }

      .page-row.active { background: var(--figma-color-bg-selected); }
      .page-copy { min-width: 0; display: grid; gap: 2px; }
      .page-copy strong, .page-copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .page-copy span { color: var(--figma-color-text-secondary); font-size: 10px; }
      .page-state { color: var(--figma-color-text-secondary); font-size: 10px; }
      .page-state.conflict, .page-state.failed { color: var(--figma-color-text-danger); }
      .page-state.source_changed, .page-state.figma_changed { color: var(--figma-color-text-warning); }

      button {
        width: 100%;
        height: 40px;
        border: 0;
        border-radius: 8px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        font-weight: 600;
        cursor: pointer;
      }

      button.secondary {
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        border: 1px solid var(--figma-color-border);
      }

      #reset-workspace {
        color: var(--figma-color-text-danger);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .result {
        min-height: 36px;
        margin: 12px 0 0;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }

      .visually-hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="status">
      <span id="status-dot" class="dot"></span>
      <div class="status-copy">
        <strong id="status-text">正在连接 Codex…</strong>
        <span id="status-detail" class="status-detail">请保持对应的 Codex 任务打开</span>
      </div>
    </div>

    <section class="pages" aria-label="CDB 页面">
      <div class="pages-header">
        <strong>页面</strong>
        <span id="catalog-count">0 个</span>
      </div>
      <div class="page-list" id="catalog-list">
        <div class="page-row"><span></span><span class="status-detail">等待 Codex 页面清单…</span></div>
      </div>
    </section>

    <div class="buttons">
      <button id="seed-page" disabled hidden>用选中稿生成当前页面</button>
      <button id="capture" disabled>发送到 CDB 工作台</button>
      <button class="secondary" id="reset-workspace" disabled>清除关联</button>
    </div>

    <p id="result" class="result">支持快速同步文字、颜色、字号、间距和圆角。</p>

    <div class="visually-hidden" aria-hidden="true">
      <span id="page-count">0</span>
      <span id="asset-count">0</span>
      <span id="feedback-count">0</span>
      <span id="log"></span>
    </div>

    <script>
      const FIGMA_PLUGIN_VERSION = "0.9.0";
      const CDB_EXACT_BUILD = "0.9.0+codex.20260829100031";
      const CDB_PROTOCOL_VERSION = 16;
      const PAGE_IR_SCHEMA_VERSION = 2;
      const captureButton = document.getElementById("capture");
      const seedPageButton = document.getElementById("seed-page");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const statusDetail = document.getElementById("status-detail");
      const resultElement = document.getElementById("result");
      const catalogList = document.getElementById("catalog-list");
      const catalogCount = document.getElementById("catalog-count");
      const resetWorkspaceButton = document.getElementById("reset-workspace");
      const pageCount = document.getElementById("page-count");
      const assetCount = document.getElementById("asset-count");
      const feedbackCount = document.getElementById("feedback-count");
      const logElement = document.getElementById("log");

      let socket = null;
      let reconnectTimer = null;
      let pairingTimer = null;
      let shouldReconnect = false;
      let localWorkspace = false;
      let endpoint = "ws://localhost:9847/ws";
      let token = "";
      let unsentChanges = false;
      let changedPageIds = [];
      let sessionEnded = false;
      let feedbackSaved = 0;
      let activeTaskId = null;
      const completedTasks = new Set();
      const importedAssets = new Set();
      const importedPages = new Set();
      let catalogPages = [];
      let activePageId = "";
      let connectedProjectName = "";
      let connectedProjectKey = "";
      let helloProjectKey = "";
      let designSessionId = createIdentity("session");
      let designSelection = null;
      let activeOfferId = "";

      seedPageButton.addEventListener("click", () => {
        const page = catalogPages.find((candidate) => candidate.id === activePageId);
        if (!page?.acceptsFigmaSeed) return;
        seedPageButton.disabled = true;
        resultElement.textContent = "正在把选中的 Figma 页面生成到 Codex…";
        parent.postMessage(
          {
            pluginMessage: {
              type: "page.seed.capture",
              pageId: page.id,
              sourceHash: page.sourceHash,
              requestId: `figma-seed-${Date.now()}`,
              projectKey: connectedProjectKey,
            },
          },
          "*",
        );
      });

      captureButton.addEventListener("click", () => {
        captureButton.disabled = true;
        if (selectedFrameHasCurrentProjectLink()) {
          captureButton.textContent = "正在发送修改…";
          setStatus("connected", "正在把 Figma 修改传给 Codex…");
          statusDetail.textContent = "发送成功后 Codex 会自动开始处理";
          parent.postMessage({ pluginMessage: {
            type: "review.capture",
            requestId: `figma-changes-${Date.now()}`,
            projectKey: connectedProjectKey,
          } }, "*");
          return;
        }
        activeOfferId = createIdentity("offer");
        captureButton.textContent = "正在准备…";
        setStatus("connected", "正在提交设计提案…");
        statusDetail.textContent = "CDB 会决定项目和源码位置";
        parent.postMessage({ pluginMessage: {
          type: "figma.design.offer.capture",
          offerId: activeOfferId,
          sessionId: designSessionId,
          projectKey: connectedProjectKey,
        } }, "*");
      });

      resetWorkspaceButton.addEventListener("click", () => {
        const confirmed = window.confirm(
          "确定清除 Figma 中的 CDB 关联数据？\n\n页面关联、传输记录和待发送修改会被清空；Codex 项目、源码和 Figma 画布内容都会保持原样。",
        );
        if (!confirmed) return;
        resetWorkspaceButton.disabled = true;
        resetWorkspaceButton.textContent = "重置中…";
        resultElement.textContent = "正在清空当前 CDB 任务…";
        send({ type: "workspace.reset.request" });
      });

      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.type === "plugin.settings") {
          endpoint = message.endpoint || endpoint;
          token = message.token || "";
          if (
            message.designRecovery?.sessionId &&
            message.designRecovery?.offerId
          ) {
            designSessionId = String(message.designRecovery.sessionId);
            activeOfferId = String(message.designRecovery.offerId);
          }
          if (token) {
            shouldReconnect = true;
            connect();
          } else {
            shouldReconnect = true;
            autoPair();
          }
          return;
        }
        if (message.type === "plugin.ready") {
          for (const assetId of message.importedAssetIds || []) {
            importedAssets.add(assetId);
          }
          for (const pageId of message.importedPageIds || []) {
            importedPages.add(pageId);
          }
          unsentChanges = Boolean(message.unsentChanges);
          changedPageIds = message.changedPageIds || [];
          appendLog(`Figma ready · ${message.pageName}`);
          return;
        }
        if (message.type === "workspace.identity.ready") {
          importedPages.clear();
          for (const pageId of message.importedPageIds || []) {
            importedPages.add(pageId);
          }
          unsentChanges = Boolean(message.unsentChanges);
          changedPageIds = message.changedPageIds || [];
          pageCount.textContent = String(importedPages.size);
          renderCatalogActions();
          renderDesignSelection();
          return;
        }
        if (message.type === "figma.design.selection") {
          designSelection = message.selection || null;
          renderDesignSelection();
          return;
        }
        if (message.type === "figma.design.offer.emit") {
          send(message.offer);
          captureButton.textContent = "等待 CDB…";
          resultElement.textContent = "设计提案已发送，等待 CDB 选择目标。";
          return;
        }
        if (message.type === "figma.design.progress.emit") {
          send({
            type: "figma.design.progress",
            protocolVersion: CDB_PROTOCOL_VERSION,
            runtimeIdentity: currentRuntimeIdentity(),
            offerId: message.offerId,
            sessionId: message.sessionId,
            phase: message.phase,
            completed: message.completed || 0,
            total: message.total || 0,
            message: message.message || "",
          });
          resultElement.textContent = message.message || "正在采集完整页面…";
          setStatus("connected", "正在读取完整页面");
          statusDetail.textContent = message.total
            ? `${message.completed || 0} / ${message.total} 个图层`
            : "不可导出的隐藏图层会自动跳过";
          return;
        }
        if (message.type === "figma.design.payload.emit") {
          send(message.payload);
          captureButton.disabled = true;
          captureButton.textContent = "正在传输…";
          resultElement.textContent = "完整页面和资源已发送，等待 CDB 校验。";
          statusDetail.textContent = message.payload?.report?.degradations?.length
            ? `已跳过 ${message.payload.report.degradations.length} 个不可导出图层`
            : "全部图层已读取";
          return;
        }
        if (message.type === "workspace.reset.complete") {
          importedAssets.clear();
          importedPages.clear();
          changedPageIds = [];
          unsentChanges = false;
          catalogPages = [];
          activePageId = "";
          renderCatalog();
          captureButton.disabled = true;
          resetWorkspaceButton.disabled = true;
          resetWorkspaceButton.textContent = "清除关联";
          setConnectedStatus();
          statusDetail.textContent = "Figma 关联已清空 · Codex 项目仍保持打开";
          resultElement.textContent = "可以继续在当前 Codex 项目中发送页面到 Figma。";
          return;
        }
        if (message.type === "page.changes.status") {
          unsentChanges = Boolean(message.unsentChanges);
          changedPageIds = message.changedPageIds || [];
          send({
            type: "page.changes.status",
            unsentChanges,
            changedPageIds: message.changedPageIds || [],
          });
          if (localWorkspace && socket?.readyState === WebSocket.OPEN) {
            captureButton.textContent = "发送到 CDB 工作台";
            statusDetail.textContent = unsentChanges
              ? "有尚未发送的修改"
              : "当前修改已发送";
            renderDesignSelection();
          }
          return;
        }
        if (message.type === "page.result") {
          if (message.ok) {
            importedPages.add(message.pageId);
            pageCount.textContent = String(importedPages.size);
            appendLog(
              `${message.reused ? "Reused" : "Imported"} page ${message.pageId} · ${message.nodes} nodes`,
            );
          } else {
            appendLog(
              `Page import failed ${message.pageId}: ${message.error}` +
                (message.rolledBack ? " · previous version kept" : ""),
            );
          }
          renderCatalogActions();
          send({ type: "page.import.result", result: message });
          return;
        }
        if (message.type === "page.import.undo.result") {
          resultElement.textContent = message.ok
            ? "已撤销接受 HTML，Figma 页面已恢复。"
            : message.error || "Figma 页面未能恢复。";
          statusDetail.textContent = message.ok
            ? "冲突已重新打开"
            : "请回到 CDB 工作台重试";
          send(message);
          return;
        }
        if (message.type === "asset.result") {
          if (message.ok) {
            importedAssets.add(message.assetId);
            assetCount.textContent = String(importedAssets.size);
            appendLog(`Imported ${message.assetId} · ${message.elements} targets`);
          } else {
            appendLog(
              `Import failed ${message.assetId}: ${message.error}` +
                (message.rolledBack ? " · previous version kept" : ""),
            );
          }
          return;
        }
        if (message.type === "feedback.emit") {
          send({
            type: "feedback.record",
            requestId: message.requestId,
            feedback: message.feedback,
          });
          return;
        }
        if (message.type === "page.changes.emit") {
          const changeCount =
            (message.changeSet?.changes?.length || 0) +
            (message.changeSet?.annotations?.length || 0);
          send({
            type: "page.changes.record",
            requestId: message.requestId,
            changeSet: message.changeSet,
          });
          resultElement.textContent = `已找到 ${changeCount} 处修改，正在写入页面…`;
          return;
        }
        if (message.type === "page.changes.empty") {
          send({
            type: "page.changes.empty",
            requestId: message.requestId || null,
          });
          if (localWorkspace) {
            captureButton.disabled = false;
            captureButton.textContent = "发送到 CDB 工作台";
            setStatus("connected", "没有新的修改");
            statusDetail.textContent = "继续在 Figma 中调整即可";
            resultElement.textContent = "当前设计与上次发送时一致。";
          }
          return;
        }
        if (message.type === "design.submit") {
          activeTaskId = message.requestId;
          captureButton.textContent = "Submitting…";
          send({
            type: "design.generate",
            requestId: message.requestId,
            design: message.design,
          });
          return;
        }
        if (message.type === "page.changes.complete") {
          send({
            type: "page.changes.complete",
            requestId: message.requestId || null,
            count: message.count || 0,
          });
          return;
        }
        if (message.type === "notice") {
          appendLog(message.message);
          return;
        }
        if (message.type === "plugin.error") {
          appendLog(`Plugin error: ${message.error}`);
          captureButton.disabled = false;
          captureButton.textContent = "重新发送到 CDB";
          setStatus("error", "这次没有发送成功");
          statusDetail.textContent = message.error || "可以直接重试";
          resultElement.textContent = "不会重复修改代码；修正问题后可直接重试。";
          renderCatalogActions();
        }
      };

      function connect() {
        clearTimeout(reconnectTimer);
        if (socket) {
          socket.onclose = null;
          socket.close();
        }

        const nextEndpoint = endpoint.trim();
        const nextToken = token.trim();
        if (!nextEndpoint || !nextToken) {
          autoPair();
          return;
        }

        parent.postMessage(
          {
            pluginMessage: {
              type: "settings.save",
              endpoint: nextEndpoint,
              token: nextToken,
            },
          },
          "*",
        );
        setStatus("", connectedProjectName
          ? `正在连接 · ${connectedProjectName}`
          : "正在连接 Codex…");

        const separator = nextEndpoint.includes("?") ? "&" : "?";
        socket = new WebSocket(`${nextEndpoint}${separator}token=${encodeURIComponent(nextToken)}`);
        socket.onopen = () => {
          clearTimeout(pairingTimer);
          sessionEnded = false;
          setConnectedStatus();
          captureButton.disabled = false;
          resetWorkspaceButton.disabled = false;
          send({
            type: "plugin.hello",
            protocolVersion: CDB_PROTOCOL_VERSION,
            runtimeIdentity: currentRuntimeIdentity(),
            pluginVersion: FIGMA_PLUGIN_VERSION,
            sessionId: designSessionId,
            importedAssetIds: [...importedAssets],
            importedPageIds: [...importedPages],
            unsentChanges,
            changedPageIds,
            projectKey: connectedProjectKey,
          });
          helloProjectKey = connectedProjectKey;
          appendLog("Connected to local bridge");
        };
        socket.onmessage = (event) => handleBridgeMessage(JSON.parse(event.data));
        socket.onerror = () => {
          setStatus("error", "暂时无法连接 Codex");
          statusDetail.textContent = "正在自动重连";
        };
        socket.onclose = () => {
          captureButton.disabled = true;
          resetWorkspaceButton.disabled = true;
          setStatus(
            "",
            sessionEnded ? "本次设计已结束" : "等待 Codex 页面…",
          );
          statusDetail.textContent = sessionEnded
            ? "开始新设计后会自动连接"
            : "打开对应的 Codex 设计任务后会自动连接";
          if (shouldReconnect) {
            pairingTimer = setTimeout(autoPair, 1500);
          }
        };
      }

      async function autoPair() {
        clearTimeout(pairingTimer);
        if (!shouldReconnect) return;
        setStatus("", "正在寻找 Codex 页面…");
        try {
          const response = await fetch("http://localhost:9847/api/pair", {
            cache: "no-store",
          });
          if (!response.ok) throw new Error("Workspace not ready");
          const pairing = await response.json();
          if (!pairing.token || !pairing.wsUrl) {
            throw new Error("Invalid pairing response");
          }
          endpoint = pairing.wsUrl;
          token = pairing.token;
          connectedProjectName = String(pairing.projectName || "");
          connectedProjectKey = String(pairing.projectKey || "");
          renderCatalog();
          connect();
        } catch {
          pairingTimer = setTimeout(autoPair, 1500);
        }
      }

      function handleBridgeMessage(message) {
        if (message.type === "plugin.ready") {
          localWorkspace = Boolean(message.localWorkspace);
          connectedProjectName = String(message.projectName || connectedProjectName);
          connectedProjectKey = String(message.projectKey || connectedProjectKey);
          if (connectedProjectKey) {
            parent.postMessage({ pluginMessage: {
              type: "workspace.identity",
              projectKey: connectedProjectKey,
            } }, "*");
          }
          if (connectedProjectKey && connectedProjectKey !== helloProjectKey) {
            send({
              type: "plugin.hello",
              protocolVersion: CDB_PROTOCOL_VERSION,
              runtimeIdentity: currentRuntimeIdentity(),
              pluginVersion: FIGMA_PLUGIN_VERSION,
              sessionId: designSessionId,
              importedAssetIds: [...importedAssets],
              importedPageIds: [...importedPages],
              unsentChanges,
              changedPageIds,
              projectKey: connectedProjectKey,
            });
            helloProjectKey = connectedProjectKey;
          }
          assetCount.textContent = String(message.assets || 0);
          pageCount.textContent = String(message.pages || 0);
          if (message.codexRunner?.runningTaskId) {
            captureButton.disabled = true;
            captureButton.textContent = "Codex 正在更新…";
            setStatus("connected", "Codex 正在更新页面");
          } else {
            activeTaskId = null;
            captureButton.disabled = false;
            captureButton.textContent = "发送到 CDB 工作台";
            setConnectedStatus();
          }
          resetWorkspaceButton.disabled = !localWorkspace;
          renderCatalog();
          if (message.projectName) {
            appendLog(`Project ready: ${message.projectName}`);
          }
          if (message.runtimeVersion) {
            appendLog(`CDB runtime: ${message.runtimeVersion}`);
          }
          return;
        }
        if (message.type === "figma.design.offer.ack") {
          if (message.state === "rejected") {
            activeOfferId = "";
            parent.postMessage({ pluginMessage: {
              type: "figma.design.recovery.clear",
            } }, "*");
            captureButton.disabled = !designSelection?.supported;
            captureButton.textContent = "重新发送到 CDB";
            setStatus("error", "设计提案未被接收");
            resultElement.textContent = message.error || "请重新选择后再试。";
          } else {
            captureButton.disabled = true;
            captureButton.textContent = "等待 CDB…";
            setStatus("connected", message.duplicate ? "CDB 已有这份提案" : "提案已到达 CDB");
            statusDetail.textContent = "回到 CDB 工作台选择新建、添加或更新目标";
            resultElement.textContent = "Frame 已安全进入接收箱，Figma 画布不会被修改。";
          }
          return;
        }
        if (message.type === "figma.design.inbox") {
          const offers = Array.isArray(message.offers) ? message.offers : [];
          const offer = offers.find(
            (candidate) => candidate?.offerId === activeOfferId,
          );
          if (activeOfferId && !offer) {
            activeOfferId = "";
            parent.postMessage({ pluginMessage: {
              type: "figma.design.recovery.clear",
            } }, "*");
            captureButton.disabled = !designSelection?.supported;
            captureButton.textContent = "发送到 CDB 工作台";
            setConnectedStatus();
            renderDesignSelection();
            return;
          }
          if (offer) {
            captureButton.disabled = true;
            if (offer.state === "pending") {
              captureButton.textContent = "等待 CDB…";
              setStatus("connected", "提案已到达 CDB");
              statusDetail.textContent = "回到 CDB 工作台选择添加、更新或创建目标";
              resultElement.textContent = "提案已在本地工作台收件箱中。";
            } else {
              captureButton.textContent = "正在恢复…";
              setStatus("connected", "正在恢复当前传输");
              statusDetail.textContent = "CDB 正在读取当前版本的处理结果";
            }
            send({
              type: "figma.design.result.query",
              protocolVersion: CDB_PROTOCOL_VERSION,
              runtimeIdentity: currentRuntimeIdentity(),
              offerId: offer.offerId,
              sessionId: designSessionId,
            });
          }
          return;
        }
        if (message.type === "figma.design.accept") {
          activeOfferId = String(message.offerId || activeOfferId);
          captureButton.disabled = true;
          captureButton.textContent = "正在采集…";
          setStatus("connected", "CDB 已接收提案");
          statusDetail.textContent = "正在重新读取原始 Frame 和资源";
          parent.postMessage({ pluginMessage: {
            type: "figma.design.payload.capture",
            offerId: message.offerId,
            sessionId: message.sessionId,
            rootNodeId: message.rootNodeId || "",
            estimatedNodeCount: message.estimatedNodeCount || 0,
          } }, "*");
          return;
        }
        if (message.type === "figma.design.result") {
          captureButton.disabled = !designSelection?.supported;
          captureButton.textContent = "发送到 CDB 工作台";
          if (message.state === "payload_received") {
            setStatus("connected", "完整页面已传输");
            statusDetail.textContent = "回到 CDB 工作台完成页面生成";
            resultElement.textContent = message.result?.degradationCount
              ? `传输完成；${message.result.degradationCount} 个不可导出图层已安全降级。`
              : "传输完成，CDB 已收到全部可编辑内容。";
          } else if (message.state === "failed") {
            activeOfferId = "";
            parent.postMessage({ pluginMessage: {
              type: "figma.design.recovery.clear",
            } }, "*");
            setStatus("error", "页面传输未完成");
            statusDetail.textContent = "已收到的提案仍保留，可以直接重试";
            resultElement.textContent = message.error || "CDB 校验失败。";
          } else if (message.state === "completed" && message.result?.pageId) {
            parent.postMessage({ pluginMessage: {
              type: "figma.design.result.accepted",
              result: message.result,
            } }, "*");
            activeOfferId = "";
            setStatus("connected", "页面代码已生成");
            statusDetail.textContent = "Figma Frame 已建立本地页面映射";
            resultElement.textContent = `已生成 ${message.result.entry || message.result.pageId}`;
          } else {
            if (message.state === "cancelled") {
              activeOfferId = "";
              parent.postMessage({ pluginMessage: {
                type: "figma.design.recovery.clear",
              } }, "*");
            }
            if (message.state === "pending") {
              captureButton.disabled = true;
              captureButton.textContent = "等待 CDB…";
              setStatus("connected", "提案已到达 CDB");
              statusDetail.textContent = "回到 CDB 工作台选择添加、更新或创建目标";
              resultElement.textContent = "提案已在本地工作台收件箱中。";
            } else {
              resultElement.textContent = message.state === "cancelled"
                ? "设计提案已取消。"
                : `设计提案状态：${message.state || "未知"}`;
            }
          }
          return;
        }
        if (message.type === "design.task") {
          const task = message.task;
          if (!task) return;
          activeTaskId = task.taskId || activeTaskId;
          if (task.state === "queued") {
            captureButton.disabled = true;
            captureButton.textContent = "等待 Codex…";
            appendLog(`Queued Codex task ${task.taskId}`);
          } else if (task.state === "running") {
            captureButton.disabled = true;
            captureButton.textContent = "Codex 正在更新…";
            setStatus("connected", "Codex 正在更新页面");
            appendLog(`Codex started ${task.taskId}`);
          } else if (task.state === "completed") {
            captureButton.disabled = false;
            captureButton.textContent = "发送到 CDB 工作台";
            setStatus("connected", "页面代码已更新");
            if (!completedTasks.has(task.taskId)) {
              completedTasks.add(task.taskId);
              feedbackSaved += 1;
              feedbackCount.textContent = String(feedbackSaved);
            }
            appendLog(`Code updated · ${task.lastMessagePath || task.taskId}`);
          } else if (task.state === "failed") {
            captureButton.disabled = false;
            captureButton.textContent = "重新发送到 CDB";
            setStatus("error", "Codex 更新失败");
            appendLog(`Codex failed: ${task.error || "Unknown error"}`);
          }
          return;
        }
        if (message.type === "asset.upsert") {
          parent.postMessage(
            { pluginMessage: { type: "asset.upsert", asset: message.asset } },
            "*",
          );
          return;
        }
        if (message.type === "asset.remove") {
          importedAssets.delete(message.assetId);
          assetCount.textContent = String(importedAssets.size);
          parent.postMessage(
            { pluginMessage: { type: "asset.remove", assetId: message.assetId } },
            "*",
          );
          return;
        }
        if (message.type === "asset.error") {
          appendLog(`Rejected ${message.assetId}: ${message.error}`);
          return;
        }
        if (message.type === "page.upsert") {
          parent.postMessage(
            { pluginMessage: { type: "page.upsert", page: message.page } },
            "*",
          );
          return;
        }
        if (message.type === "page.node.locate") {
          parent.postMessage(
            { pluginMessage: message },
            "*",
          );
          return;
        }
        if (message.type === "page.import.undo") {
          parent.postMessage(
            { pluginMessage: message },
            "*",
          );
          return;
        }
        if (message.type === "page.catalog") {
          catalogPages = Array.isArray(message.pages) ? message.pages : [];
          if (!catalogPages.some((page) => page.id === activePageId)) {
            activePageId = catalogPages[0]?.id || "";
          }
          renderCatalog();
          renderDesignSelection();
          return;
        }
        if (message.type === "workspace.reset.result") {
          if (!message.ok) {
            resetWorkspaceButton.disabled = false;
            resetWorkspaceButton.textContent = "清除关联";
            resultElement.textContent = message.error || "工作台重置失败。";
            return;
          }
          parent.postMessage(
            { pluginMessage: { type: "workspace.reset" } },
            "*",
          );
          return;
        }
        if (message.type === "page.changes.request") {
          parent.postMessage(
            {
              pluginMessage: {
                type: "review.capture",
                requestId: message.requestId || null,
              },
            },
            "*",
          );
          return;
        }
        if (message.type === "page.remove") {
          importedPages.delete(message.pageId);
          pageCount.textContent = String(importedPages.size);
          parent.postMessage(
            { pluginMessage: { type: "page.remove", pageId: message.pageId } },
            "*",
          );
          return;
        }
        if (message.type === "page.error") {
          appendLog(`Rejected page ${message.pageId}: ${message.error}`);
          return;
        }
        if (message.type === "feedback.ack") {
          appendLog(
            `${message.state === "conflict" ? "Conflict" : "Saved"} feedback · ${message.path}`,
          );
          return;
        }
        if (message.type === "page.changes.ack") {
          appendLog(
            `${message.state === "conflict" ? "Conflict" : "Saved"} page changes · ${message.path}`,
          );
          const fastApply = message.fastApply || {};
          const appliedCount = fastApply.appliedCount || 0;
          const pendingCount = fastApply.pendingCount || 0;
          if (pendingCount === 0) {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "page.changes.accepted",
                  pageId: message.pageId || null,
                  sourceHash: message.sourceHash || null,
                  changeSetId: message.changeSetId || null,
                },
              },
              "*",
            );
          }
          const seconds = Math.max(
            0.1,
            (fastApply.durationMs || 0) / 1000,
          ).toFixed(1);
          captureButton.disabled = false;
          unsentChanges = pendingCount > 0;
          captureButton.textContent = pendingCount > 0 ? "重试生成" : "发送到 CDB 工作台";
          if (appliedCount > 0 && pendingCount === 0) {
            setStatus("connected", `已更新 ${appliedCount} 处修改`);
            statusDetail.textContent = "Codex 页面代码已经保存";
            resultElement.textContent = `${fastApply.changedFiles?.join("、") || "页面文件"} · ${seconds} 秒`;
          } else if (appliedCount > 0) {
            setStatus("connected", `已更新 ${appliedCount} 处修改`);
            statusDetail.textContent = `另有 ${pendingCount} 处交给 Codex 处理`;
            resultElement.textContent = "页面不会阻塞，可以继续设计。";
          } else {
            const reason = fastApply.pending?.[0]?.reason || "unknown";
            const detail = String(fastApply.error || "").trim();
            setStatus("error", "已收到，但生成未完成");
            statusDetail.textContent = `CDB 落盘失败：${detail || pendingReasonLabel(reason)}`;
            resultElement.textContent = `失败阶段：生成页面代码 · ${reason}`;
          }
          renderCatalogActions();
          return;
        }
        if (message.type === "session.ended") {
          sessionEnded = true;
          localWorkspace = false;
          catalogPages = [];
          activePageId = "";
          renderCatalog();
          captureButton.disabled = true;
          resetWorkspaceButton.disabled = true;
          captureButton.textContent = "本次设计已结束";
          setStatus("", "本次设计已结束");
          statusDetail.textContent = "开始新设计后会自动连接";
          resultElement.textContent =
            "如有尚未发送的修改，它们仍保留在当前 Figma 文件中。";
          return;
        }
        if (message.type === "session.replaced") {
          appendLog("旧连接已由当前连接替换");
          sessionEnded = true;
          shouldReconnect = false;
          clearTimeout(reconnectTimer);
          clearTimeout(pairingTimer);
          if (socket) {
            socket.onclose = null;
            socket.close();
          }
          return;
        }
        if (message.type === "bridge.error") {
          appendLog(`Bridge error: ${message.error}`);
          captureButton.disabled = false;
          captureButton.textContent = "重新发送到 CDB";
          setStatus("error", "这次没有发送成功");
          statusDetail.textContent = message.error || "连接仍会自动恢复";
          resultElement.textContent = message.code
            ? `错误代码：${message.code}`
            : "连接仍会自动恢复，可以直接重试。";
        }
      }

      function send(value) {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          appendLog("Feedback not sent: bridge is disconnected");
          return;
        }
        socket.send(JSON.stringify(value));
      }

      function renderDesignSelection() {
        const selection = designSelection;
        const seedTarget = catalogPages.find((candidate) => candidate.id === activePageId)?.acceptsFigmaSeed;
        if (activeOfferId) {
          captureButton.disabled = true;
          captureButton.className = seedTarget ? "alternative" : "";
          captureButton.textContent = "等待 CDB…";
          resultElement.textContent = "提案已在本地工作台收件箱中。";
          return;
        }
        captureButton.disabled = !selection?.supported || !socket || socket.readyState !== WebSocket.OPEN;
        captureButton.className = seedTarget ? "alternative" : "";
        if (!activeOfferId || captureButton.textContent !== "等待 CDB…") {
          captureButton.textContent = "发送到 CDB 工作台";
        }
        if (!selection?.supported) {
          resultElement.textContent = selection?.reason || "请选择一个完整页面。";
          return;
        }
        if (!selectedFrameHasCurrentProjectLink()) {
          setStatus("connected", `已选择新页面 · ${selection.rootName}`);
          statusDetail.textContent = "将发送到当前 CDB 工作台，再选择添加为新页面";
        }
        resultElement.textContent = seedTarget
          ? `${selection.rootName} · 主按钮生成当前空白页；工作台按钮可另选目标`
          : `${selection.rootName} · ${selection.estimatedNodeCount} 个图层 · 发送后在 CDB 选择目标`;
      }

      function currentRuntimeIdentity() {
        return {
          kind: "cdb-0.9-responsive-v2",
          protocolVersion: CDB_PROTOCOL_VERSION,
          pageIrSchemaVersion: PAGE_IR_SCHEMA_VERSION,
          exactBuild: CDB_EXACT_BUILD,
        };
      }

      function createIdentity(prefix) {
        if (globalThis.crypto?.randomUUID) return `${prefix}-${globalThis.crypto.randomUUID()}`;
        return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function renderCatalog() {
        catalogCount.textContent = sessionEnded
          ? "已结束"
          : connectedProjectName
            ? `${connectedProjectName} · ${catalogPages.length} 个`
            : `${catalogPages.length} 个`;
        catalogList.replaceChildren();
        for (const page of catalogPages) {
          const row = document.createElement("div");
          row.className = `page-row${page.id === activePageId ? " active" : ""}`;
          const copy = document.createElement("span");
          copy.className = "page-copy";
          const name = document.createElement("strong");
          name.textContent = page.name || page.id;
          const route = document.createElement("span");
          route.textContent = page.entry
            ? `${page.entry} · ${page.route || "/"}`
            : page.route || "/";
          copy.append(name, route);
          const state = document.createElement("span");
          state.className = `page-state ${page.state || "not_imported"}`;
          state.textContent = stateLabel(page.state);
          state.title = stateDescription(page.state);
          row.append(copy, state);
          row.addEventListener("click", () => {
            activePageId = page.id;
            renderCatalog();
            if (page.state !== "not_imported") {
              parent.postMessage(
                { pluginMessage: { type: "page.locate", pageId: page.id } },
                "*",
              );
            }
          });
          catalogList.append(row);
        }
        if (catalogPages.length === 0) {
          const empty = document.createElement("div");
          empty.className = "page-row";
          empty.textContent = sessionEnded
            ? "任务已结束，开始新设计后刷新页面列表"
            : "当前项目没有可用页面";
          catalogList.append(empty);
        }
        renderCatalogActions();
      }

      function renderCatalogActions() {
        const activePage = catalogPages.find((page) => page.id === activePageId);
        const hasFigmaLinks = currentProjectHasFigmaLinks();
        const selectionLinked = selectedFrameHasCurrentProjectLink();
        const canSeed =
          localWorkspace &&
          activePage?.acceptsFigmaSeed &&
          ["not_imported", "conflict", "failed"].includes(activePage.state);
        seedPageButton.hidden = !canSeed;
        seedPageButton.disabled = !canSeed;
        captureButton.className = canSeed ? "alternative" : "";
        resetWorkspaceButton.disabled = !localWorkspace || !hasFigmaLinks;
        if (!activeTaskId) {
          captureButton.disabled =
            (!selectionLinked && !designSelection?.supported) ||
            !socket ||
            socket.readyState !== WebSocket.OPEN;
          captureButton.textContent = selectionLinked
            ? unsentChanges
              ? "发送修改到 CDB"
              : "重新发送到 CDB"
            : "发送到 CDB 工作台";
        }
      }

      function currentProjectHasFigmaLinks() {
        return catalogPages.some(
          (page) => page.state && page.state !== "not_imported",
        );
      }

      function selectedFrameHasCurrentProjectLink() {
        const linkedPageId = String(designSelection?.linkedPageId || "");
        const linkedProjectKey = String(designSelection?.linkedProjectKey || "");
        if (!linkedPageId) return false;
        if (
          linkedProjectKey &&
          connectedProjectKey &&
          linkedProjectKey !== connectedProjectKey
        ) {
          return false;
        }
        return catalogPages.some(
          (page) =>
            page.id === linkedPageId &&
            page.state &&
            page.state !== "not_imported",
        );
      }

      function stateLabel(state) {
        return {
          not_imported: "未导入",
          synced: "已同步",
          source_changed: "源码更新",
          figma_changed: "Figma 修改",
          conflict: "两边均有修改",
          failed: "失败",
        }[state] || "未导入";
      }

      function stateDescription(state) {
        return {
          not_imported: "这个页面还没有写入 Figma",
          synced: "源码与 Figma 处于同一同步版本",
          source_changed: "源码在上次同步后发生了修改",
          figma_changed: "Figma 在上次同步后发生了修改",
          conflict: "源码和 Figma 在上次同步后都发生了修改，请先确认要保留哪一侧",
          failed: "最近一次页面操作失败",
        }[state] || "";
      }

      function pendingReasonLabel(reason) {
        return {
          unsafe_svg_export: "Figma 矢量包含不支持的效果",
          invalid_inserted_node_style: "部分图层样式无法转换",
          stylesheet_not_found: "没有找到页面样式文件",
          source_element_not_found: "没有找到页面写入位置",
          stale_page_mapping: "页面映射已经过期",
          fast_apply_failed: "页面生成器发生异常",
        }[reason] || reason || "未知原因";
      }

      function setStatus(kind, text) {
        statusDot.className = `dot ${kind}`;
        statusText.textContent = text;
      }

      function setConnectedStatus() {
        const label = connectedProjectName || "Codex";
        const shortKey = connectedProjectKey.slice(0, 8);
        setStatus("connected", `已连接 · ${label}`);
        statusDetail.textContent = shortKey
          ? `当前唯一活动工作台 · ${shortKey}`
          : "当前唯一活动工作台";
      }

      function appendLog(message) {
        const time = new Date().toLocaleTimeString();
        logElement.textContent = `${time}  ${message}\n${logElement.textContent}`.slice(
          0,
          5000,
        );
      }
    </script>
  </body>
</html>
